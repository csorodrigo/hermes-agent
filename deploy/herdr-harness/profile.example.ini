[harness]
# Leave target blank when Hermes and Herdr run on the same workbox.
# Otherwise use an alias from ~/.ssh/config, not a raw password-based host.
target = hermes-workbox

# HerdrM currently forwards the remote default socket. Keep the primary team
# runtime in the default session and use Herdr workspaces for projects/tasks.
# Named sessions remain available for isolated/manual workflows outside HerdrM.
session = default

# Prefer one clone per Unix account. Sharing one clone's .git metadata between
# different users causes permission and worktree-lock contention.
repo = /srv/hermes/users/alice/projects/hermes-agent
worktrees_root = /srv/hermes/users/alice/worktrees/hermes-agent
base_ref = main
herdr_binary = herdr
ssh_binary = ssh
ssh_control_persist = 600
timeout_ms = 120000
