[harness]
# Leave target blank when Hermes and Herdr run on the same workbox.
# Otherwise use an alias from ~/.ssh/config, not a raw password-based host.
target = hermes-workbox
session = hermes-project-alice
repo = /srv/hermes/projects/hermes-agent
worktrees_root = /srv/hermes/worktrees/alice
base_ref = main
herdr_binary = herdr
ssh_binary = ssh
ssh_control_persist = 600
timeout_ms = 120000
